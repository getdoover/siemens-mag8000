[project]
name = "siemens-mag8000"
version = "0.1.0"
description = "Doover app for the Siemens SITRANS F M MAG 8000 water meter"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydoover>=1.17.2",
    "transitions>=0.9.2",
]

[project.scripts]
doover-app-run = "siemens_mag8000:main"
export-config = "siemens_mag8000.app_config:export"
export-ui = "siemens_mag8000.app_ui:export"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "aiohttp>=3.11.18",
    "pymodbus>=3.9.2",
    "pytest>=8.3.5",
    "grpcio>=1.65.1",
    "protobuf>=5.28.2",
    "pytest-asyncio>=0.26.0",
]
